location /api/ {
    proxy_pass https://sih-26099-prototype.onrender.com/api/;

    proxy_ssl_server_name on;
    proxy_ssl_name sih-26099-prototype.onrender.com;

    proxy_set_header Host sih-26099-prototype.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}